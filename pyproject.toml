[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sophon-cli"
dynamic = ["version"]
description = "A minimal, extensible terminal interface for development."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
[project.scripts]
sophon = "sophon.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = ["src/sophon/PYPI_VERSION"] }

[tool.setuptools.package-data]
sophon = ["VERSION", "PYPI_VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
